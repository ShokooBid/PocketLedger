version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      expo-stack:
        patterns:
          - "expo"
          - "expo-*"
          - "react"
          - "react-native"
          - "@types/react"
      development-tools:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
